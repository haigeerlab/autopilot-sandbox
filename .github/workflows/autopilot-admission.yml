# Copy to <repo>/.github/workflows/autopilot-admission.yml in a caller repo (e.g. agent-relay).
# Replace BOTH <HUB_SHA> occurrences with the same 40-char autopilot-hub commit SHA.
# Adding or updating this file is a T4 change: the repo owner commits it, a human merges it.
name: autopilot-admission

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# plugin-standard C8: nothing at the top level; each job asks for what it needs.
permissions: {}

jobs:
  admission:
    permissions:
      contents: read
      checks: write
      pull-requests: write
      issues: write
    # Template only: replace both <HUB_SHA> placeholders with the same 40-char commit SHA.
    uses: haigeerlab/autopilot-hub/.github/workflows/admission.yml@cfe2f1d134a1c58490679dad1d5294f5db789c90
    with:
      hub_ref: cfe2f1d134a1c58490679dad1d5294f5db789c90
