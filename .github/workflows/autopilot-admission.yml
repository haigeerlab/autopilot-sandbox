# Copy to <repo>/.github/workflows/autopilot-admission.yml in a caller repo (e.g. agent-relay).
# Replace BOTH e7ad518c71efd4bc8bfb122c6d564a1e824d895f occurrences with the same 40-char autopilot-hub commit SHA.
# Adding or updating this file is a T4 change: the repo owner commits it, a human merges it.
name: autopilot-admission

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  checks: write
  pull-requests: write
  issues: write

jobs:
  admission:
    uses: haigeerlab/autopilot-hub/.github/workflows/admission.yml@e7ad518c71efd4bc8bfb122c6d564a1e824d895f
    with:
      hub_ref: e7ad518c71efd4bc8bfb122c6d564a1e824d895f
