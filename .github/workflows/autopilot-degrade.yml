# Copy to <repo>/.github/workflows/autopilot-degrade.yml in a caller repo (e.g. agent-relay).
# Replace BOTH <HUB_SHA> occurrences with the same 40-char autopilot-hub commit SHA, and
# <MAIN_CI> with the `name:` of the repo's main CI workflow (agent-relay: CI).
# Adding or updating this file is a T4 change: the repo owner commits it, a human merges it.
name: autopilot-degrade

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  issues:
    types: [labeled, closed] # closed: 降级 issue 只有管理员本人关闭才算解除（hub 切片 11）

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

jobs:
  degrade:
    uses: haigeerlab/autopilot-hub/.github/workflows/degrade.yml@9704e516f4fc3b7369f506ac66a50f074978e896
    with:
      hub_ref: 9704e516f4fc3b7369f506ac66a50f074978e896
